name: python-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          which python
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip list

      - name: Run tests
        run: |
          python -m pytest -q
